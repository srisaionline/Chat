<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sri Sai Online Services — Smart Card Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f4c81 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .chat-shell {
      width: 100%;
      max-width: 470px;
      height: 92vh;
      max-height: 820px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chat-header {
      background: linear-gradient(135deg, #0b3b66 0%, #0f4c81 60%, #1d4ed8 100%);
      color: #ffffff;
      padding: 16px 18px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #fde047;
      flex-shrink: 0;
    }

    .brand-info h1 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: #dbeafe;
      margin-top: 2px;
      display: block;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #facc15;
      display: inline-block;
    }

    .status-dot.online {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .status-dot.offline {
      background: #f87171;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn, .reset-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .reset-btn {
      padding: 8px 12px;
    }

    .icon-btn:hover, .reset-btn:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .welcome-banner {
      background: linear-gradient(90deg, #eff6ff 0%, #f0fdf4 100%);
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .welcome-text {
      font-size: 12px;
      color: #1e3a8a;
      line-height: 1.35;
    }

    .welcome-text strong {
      color: #0f4c81;
      display: block;
      font-size: 12.5px;
    }

    .wallet-badge {
      background: #0f4c81;
      color: #fde047;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 86%;
      animation: fadeSlide 0.22s ease-out;
    }

    .msg-row.bot { align-self: flex-start; }
    .msg-row.user { align-self: flex-end; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.48;
      word-wrap: break-word;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .msg.bot {
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: linear-gradient(135deg, #0f4c81, #1d4ed8);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg-row.user .msg-time {
      text-align: right;
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .chip {
      background: #ffffff;
      color: #0f4c81;
      border: 1.5px solid #93c5fd;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .chip:hover {
      background: #0f4c81;
      color: #ffffff;
      border-color: #0f4c81;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 15px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
    }

    .chat-input input:focus {
      border-color: #0f4c81;
      background: #ffffff;
    }

    .chat-input button {
      background: linear-gradient(135deg, #0f4c81, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .chat-input button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      font-size: 10.5px;
      color: #64748b;
      background: #f8fafc;
      padding: 6px 10px;
      border-top: 1px solid #f1f5f9;
    }

    @media (max-width: 500px) {
      body { padding: 0; }
      .chat-shell { height: 100vh; max-height: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="chat-shell">
    <div class="chat-header">
      <div class="brand-wrap">
        <div class="brand-avatar">SS</div>
        <div class="brand-info">
          <h1>Sri Sai Online Services</h1>
          <span class="brand-sub">Online Center • PAN Center</span>
          <div class="status-row">
            <span class="status-dot" id="statusDot"></span>
            <span id="serverStatus">Connecting to server...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="soundBtn" title="Toggle Sound" onclick="toggleSound()">🔊</button>
        <button class="reset-btn" onclick="resetChat()">New Card</button>
      </div>
    </div>

    <div class="welcome-banner">
      <div class="welcome-text" id="greetingBanner">
        <strong>Welcome to Sri Sai Online Services</strong>
        Online Center &amp; PAN Center
      </div>
      <span class="wallet-badge" id="walletBadge">Wallet: ₹0</span>
    </div>

    <div class="chat-body" id="chatBody"></div>

    <form class="chat-input" id="chatForm">
      <input type="text" id="userInput" placeholder="Enter registered mobile number..." autocomplete="off" />
      <button type="submit" id="sendBtn">Send</button>
    </form>

    <div class="footer-note">
      Sri Sai Online Services • Direct PDF Download
    </div>
  </div>

  <script>
    const SERVER_ERR_MSG = "Server error. Try after some time or try another server.";
    const ADMIN_PHONE = "8247709435";
    let API_BASE = "";
    let soundEnabled = true;
    let hasPlayedWelcome = false;

    const chatBody = document.getElementById("chatBody");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const serverStatus = document.getElementById("serverStatus");
    const statusDot = document.getElementById("statusDot");
    const greetingBanner = document.getElementById("greetingBanner");
    const walletBadge = document.getElementById("walletBadge");
    const soundBtn = document.getElementById("soundBtn");

    let state = {};

    function setWalletBalance(bal) {
      state.balance = Number(bal || 0);
      walletBadge.textContent = `Wallet: ₹${state.balance}`;
    }

    function getTimeGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return "Good Morning ☀️";
      if (hour < 17) return "Good Afternoon 🌤️";
      return "Good Evening 🌆";
    }

    function updateGreetingBanner() {
      const greet = getTimeGreeting();
      greetingBanner.innerHTML = `<strong>${greet}! Welcome to Sri Sai Online Services</strong>Online Center — PAN Center`;
    }

    function playWelcomeChime() {
      if (!soundEnabled || hasPlayedWelcome) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        const notes = [523.25, 659.25, 783.99, 1046.5];
        const now = ctx.currentTime;
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + i * 0.11);
          gain.gain.setValueAtTime(0.001, now + i * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.12, now + i * 0.11 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.11);
          osc.stop(now + i * 0.11 + 0.36);
        });
        hasPlayedWelcome = true;
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
      if (soundEnabled) {
        hasPlayedWelcome = false;
        playWelcomeChime();
      }
    }

    function unlockAudioOnce() {
      if (!hasPlayedWelcome && soundEnabled) playWelcomeChime();
      window.removeEventListener("pointerdown", unlockAudioOnce);
      window.removeEventListener("keydown", unlockAudioOnce);
    }
    window.addEventListener("pointerdown", unlockAudioOnce);
    window.addEventListener("keydown", unlockAudioOnce);

    function getCurrentTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    async function loadServerUrl() {
      try {
        const res = await fetch(
          `https://api.github.com/repos/srisaionline/Chat/contents/url.json?t=${Date.now()}`,
          {
            cache: "no-store",
            headers: { "Accept": "application/vnd.github+json" }
          }
        );
        if (!res.ok) throw new Error("API fetch failed");
        const meta = await res.json();
        const decoded = atob(meta.content.replace(/\n/g, ""));
        const data = JSON.parse(decoded);

        if (!data.api_url) throw new Error("api_url missing");
        API_BASE = data.api_url.replace(/\/+$/, "");
        serverStatus.textContent = "Server Online (Ready)";
        statusDot.className = "status-dot online";
        return true;
      } catch (err) {
        try {
          const fallback = await fetch(
            `https://raw.githubusercontent.com/srisaionline/Chat/main/url.json?t=${Date.now()}`,
            { cache: "no-store" }
          );
          const data = await fallback.json();
          API_BASE = data.api_url.replace(/\/+$/, "");
          serverStatus.textContent = "Server Online (Ready)";
          statusDot.className = "status-dot online";
          return true;
        } catch {
          serverStatus.textContent = "Server Offline";
          statusDot.className = "status-dot offline";
          return false;
        }
      }
    }

    function addMsg(html, sender = "bot") {
      const row = document.createElement("div");
      row.className = `msg-row ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = `msg ${sender}`;
      bubble.innerHTML = html;

      const time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = getCurrentTime();

      row.appendChild(bubble);
      row.appendChild(time);
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
      return row;
    }

    function addTypingMsg(text) {
      return addMsg(
        `<div style="margin-bottom:4px;">${text}</div><div class="typing"><span></span><span></span><span></span></div>`,
        "bot"
      );
    }

    function addChips(options, onSelect) {
      const wrap = document.createElement("div");
      wrap.className = "quick-replies";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = opt.label;
        btn.onclick = () => {
          wrap.remove();
          addMsg(opt.label, "user");
          onSelect(opt.value);
        };
        wrap.appendChild(btn);
      });
      chatBody.appendChild(wrap);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function setInputEnabled(enabled, placeholder = "Type your reply...") {
      userInput.disabled = !enabled;
      sendBtn.disabled = !enabled;
      userInput.placeholder = placeholder;
      if (enabled) userInput.focus();
    }

    function formatMemberChipLabel(m) {
      const g = (m.gender || "").trim().toUpperCase();
      if (g && g !== "NA") {
        return `${m.name} (${g})`;
      }
      return m.name;
    }

    function showHistoryList() {
      const hist = state.history || [];
      if (!hist.length) {
        addMsg("No recent history found for your account.");
        return;
      }
      const rows = hist.slice(0, 8).map(h =>
        `• <b>${h.card_type}</b> (${h.ration_no}) — <b>${h.amount}</b> [${h.timestamp}]`
      ).join("<br>");
      addMsg(`📜 <b>Recent History:</b><br>${rows}`);
    }

    function showServiceMenu() {
      state.step = "MENU";
      addMsg(
        `✅ Welcome, <b>${state.userName}</b> (<b>+${state.userPhone}</b>)<br>` +
        `Wallet Balance: <b>₹${state.balance}</b><br>` +
        `Choose an option below:`
      );
      setInputEnabled(false, "Select an option above...");

      addChips([
        { label: "🪪 QR Card — Server 1", value: "qr_s1" },
        { label: "⚡ QR Card — Server 2", value: "qr_s2" },
        { label: "📋 Table Card — Server 1", value: "table_s1" },
        { label: "🏥 TS Arogyasri Card", value: "arogya" },
        { label: "📜 My History", value: "history" }
      ], (choice) => {
        if (choice === "history") {
          showHistoryList();
          showServiceMenu();
          return;
        }

        state.mode = choice;
        state.step = "RATION_NO";

        if (choice === "qr_s1") {
          state.cardType = "smart_qr";
          state.fetchEndpoint = "/api/fetch";
          addMsg("Enter your <b>12-digit Ration Card Number</b>:");
        } else if (choice === "qr_s2") {
          state.cardType = "smart_qr";
          state.fetchEndpoint = "/api/fetch-server2";
          addMsg("Enter your <b>12-digit Ration Card Number</b>:");
        } else if (choice === "table_s1") {
          state.cardType = "family_table";
          state.fetchEndpoint = "/api/fetch";
          addMsg("Enter your <b>12-digit Ration Card Number</b>:");
        } else {
          state.cardType = "arogya";
          addMsg("Enter your <b>12-digit Ration Card Number</b>:");
        }
        setInputEnabled(true, "e.g. 360000000000");
      });
    }

    async function handleLogin(rawPhone) {
      setInputEnabled(false, "Checking registration...");
      const loading = addTypingMsg("Verifying registered mobile number &amp; wallet balance...");

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: rawPhone })
        });
        const data = await res.json();
        loading.remove();

        if (!res.ok) {
          addMsg(`⚠️ ${data.detail || "Mobile number not registered. Contact admin to load balance."}`);
          setInputEnabled(true, "Enter registered 10-digit Mobile Number");
          return;
        }

        state.userPhone = data.phone;
        state.userName = data.name || "User";
        state.history = data.history || [];
        setWalletBalance(data.balance);
        showServiceMenu();
      } catch (err) {
        loading.remove();
        addMsg(`⚠️ ${SERVER_ERR_MSG}`);
        setInputEnabled(true, "Enter registered 10-digit Mobile Number");
      }
    }

    async function resetChat() {
      updateGreetingBanner();
      setWalletBalance(0);
      chatBody.innerHTML = "";
      state = {
        userPhone: "",
        userName: "",
        balance: 0,
        history: [],
        mode: "qr_s1",
        cardType: "smart_qr",
        fetchEndpoint: "/api/fetch",
        step: "LOGIN_PHONE",
        rationNo: "",
        scraped: null,
        hof: "",
        village: "",
        pincode: ""
      };
      setInputEnabled(false, "Connecting...");

      const ok = await loadServerUrl();
      if (!ok) {
        addMsg(`⚠️ ${SERVER_ERR_MSG}`);
        return;
      }

      const greet = getTimeGreeting();
      addMsg(
        `<b>${greet}!</b><br>Welcome to <b>Sri Sai Online Services — Online Center &amp; PAN Center</b>.<br><br>` +
        `Enter your <b>registered 10-digit Mobile Number</b> to login:`
      );
      setInputEnabled(true, "Enter 10-digit Mobile Number");
    }

    function renderPdfSuccess(cardLabel, fileName, blob, newBalance) {
      if (newBalance !== null && newBalance !== undefined && newBalance !== "") {
        setWalletBalance(newBalance);
      }
      const url = URL.createObjectURL(blob);
      addMsg(
        `🎉 Your <b>${cardLabel}</b> is ready!<br>` +
        `<small style="color:#64748b;">Remaining Wallet Balance: <b>₹${state.balance}</b></small><br>` +
        `<a class="download-btn" href="${url}" download="${fileName}">⬇️ Download PDF</a>`
      );
      setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000);
      setInputEnabled(false, "Click 'New Card' above to start again");
    }

    async function handleArogyaPdf(rcNo) {
      if (!/^\d{10,12}$/.test(rcNo)) {
        addMsg("Please enter a valid <b>12-digit Ration Card Number</b>.");
        return;
      }
      state.rationNo = rcNo;
      setInputEnabled(false, "Generating TS Arogyasri PDF...");
      const loading = addTypingMsg("Checking balance &amp; generating your <b>TS Arogyasri Card PDF</b>...");

      try {
        const res = await fetch(`${API_BASE}/api/arogya-pdf`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-User-Phone": state.userPhone
          },
          body: JSON.stringify({ ration_no: rcNo })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          loading.remove();
          if (res.status === 402) {
            addMsg(`⚠️ ${errData.detail || "Insufficient wallet balance. Please load balance."}`);
            setInputEnabled(false, "Load wallet balance to continue");
            return;
          }
          addMsg(`⚠️ ${SERVER_ERR_MSG}`);
          setInputEnabled(true, "Enter 12-digit Ration Number");
          return;
        }

        const newBal = res.headers.get("X-Wallet-Balance");
        const blob = await res.blob();
        const fileName = `${rcNo} - TS Arogyasri Card.pdf`;
        loading.remove();
        renderPdfSuccess("TS Arogyasri Card PDF", fileName, blob, newBal);
      } catch (err) {
        loading.remove();
        addMsg(`⚠️ ${SERVER_ERR_MSG}`);
        setInputEnabled(true, "Enter 12-digit Ration Number");
      }
    }

    async function handleRationNo(rcNo) {
      if (!/^\d{12}$/.test(rcNo)) {
        addMsg("Ration Card Number must be exactly <b>12 digits</b>. Please try again.");
        return;
      }
      state.rationNo = rcNo;

      setInputEnabled(false, "Fetching details...");
      const loading = addTypingMsg("Checking balance &amp; fetching details, please wait...");

      try {
        const res = await fetch(`${API_BASE}${state.fetchEndpoint}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-User-Phone": state.userPhone
          },
          body: JSON.stringify({ ration_no: rcNo, card_type: state.cardType })
        });
        const data = await res.json();
        loading.remove();

        if (!res.ok) {
          if (res.status === 402) {
            addMsg(`⚠️ ${data.detail || "Insufficient wallet balance. Please load balance."}`);
            setInputEnabled(false, "Load wallet balance to continue");
            return;
          }
          addMsg(`⚠️ ${SERVER_ERR_MSG}`);
          setInputEnabled(true, "Enter 12-digit Ration Number");
          return;
        }

        state.scraped = data;
        state.step = "HOF";
        addMsg(
          `✅ Details found (FP Shop: <b>${data.fp_shop_no || "-"}</b>).<br>` +
          `Select the <b>Head of Family</b>:`
        );

        addChips(
          data.members.map(m => ({
            label: formatMemberChipLabel(m),
            value: m.name
          })),
          (selectedHof) => {
            state.hof = selectedHof;
            state.step = "VILLAGE";
            addMsg("Enter your <b>Village / Ward Name</b>:");
            setInputEnabled(true, "Enter Village / Ward Name");
          }
        );
      } catch (err) {
        loading.remove();
        addMsg(`⚠️ ${SERVER_ERR_MSG}`);
        setInputEnabled(true, "Enter 12-digit Ration Number");
      }
    }

    async function generatePdf() {
      const isFamilyTable = state.cardType === "family_table";
      const cardLabel = isFamilyTable ? "Family Table Card PDF" : "QR Code Card PDF";

      setInputEnabled(false, `Generating ${cardLabel}...`);
      const loading = addTypingMsg(`Designing your high-resolution <b>${cardLabel}</b>...`);

      try {
        const payload = {
          card_type: state.cardType,
          ration_no: state.rationNo,
          hof_name: state.hof,
          fp_shop_no: state.scraped.fp_shop_no,
          village: state.village,
          mandal: state.scraped.mandal,
          district: state.scraped.district,
          pincode: state.pincode,
          card_pool_type: state.scraped.card_pool_type || "",
          card_type_code: state.scraped.card_type_code || "",
          no_of_units: state.scraped.no_of_units || String(state.scraped.members.length),
          members: state.scraped.members
        };

        const res = await fetch(`${API_BASE}/api/generate-pdf`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-User-Phone": state.userPhone
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          loading.remove();
          if (res.status === 402) {
            addMsg(`⚠️ ${errData.detail || "Insufficient wallet balance. Please load balance."}`);
            setInputEnabled(false, "Load wallet balance to continue");
            return;
          }
          addMsg(`⚠️ ${SERVER_ERR_MSG}`);
          setInputEnabled(false, "Click 'New Card' to retry");
          return;
        }

        const newBal = res.headers.get("X-Wallet-Balance");
        const blob = await res.blob();
        const suffix = isFamilyTable ? "Family Details Card" : "Smart Ration Card";
        const fileName = `${state.hof} - ${suffix}.pdf`;
        loading.remove();
        renderPdfSuccess(cardLabel, fileName, blob, newBal);
      } catch (err) {
        loading.remove();
        addMsg(`⚠️ ${SERVER_ERR_MSG}`);
        setInputEnabled(false, "Click 'New Card' to retry");
      }
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = "";
      addMsg(text, "user");

      if (state.step === "LOGIN_PHONE") {
        await handleLogin(text);
      } else if (state.step === "RATION_NO") {
        if (state.cardType === "arogya") {
          await handleArogyaPdf(text);
        } else {
          await handleRationNo(text);
        }
      } else if (state.step === "VILLAGE") {
        state.village = text;
        state.step = "PINCODE";
        addMsg("Enter your <b>6-digit Pincode</b>:");
        setInputEnabled(true, "Enter 6-digit Pincode");
      } else if (state.step === "PINCODE") {
        if (!/^\d{6}$/.test(text)) {
          addMsg("Please enter a valid <b>6-digit pincode</b>.");
          return;
        }
        state.pincode = text;
        state.step = "DONE";
        await generatePdf();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      updateGreetingBanner();
      playWelcomeChime();
      resetChat();
    });
  </script>
</body>
</html>
