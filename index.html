<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sri Sai Online Services — TS Ration Smart Card Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f4c81 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .chat-shell {
      width: 100%;
      max-width: 470px;
      height: 92vh;
      max-height: 820px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #0b3b66 0%, #0f4c81 60%, #1d4ed8 100%);
      color: #ffffff;
      padding: 16px 18px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fde047;
      flex-shrink: 0;
    }

    .brand-info h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: #dbeafe;
      margin-top: 2px;
      display: block;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #facc15;
      display: inline-block;
    }

    .status-dot.online {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .status-dot.offline {
      background: #f87171;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn, .reset-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .reset-btn {
      padding: 8px 12px;
    }

    .icon-btn:hover, .reset-btn:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    /* Welcome Banner */
    .welcome-banner {
      background: linear-gradient(90deg, #eff6ff 0%, #f0fdf4 100%);
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .welcome-text {
      font-size: 12px;
      color: #1e3a8a;
      line-height: 1.35;
    }

    .welcome-text strong {
      color: #0f4c81;
      display: block;
      font-size: 12.5px;
    }

    .service-badge {
      background: #0f4c81;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* Chat Body */
    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeSlide 0.22s ease-out;
    }

    .msg-row.bot { align-self: flex-start; }
    .msg-row.user { align-self: flex-end; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg {
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.48;
      word-wrap: break-word;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .msg.bot {
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: linear-gradient(135deg, #0f4c81, #1d4ed8);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg-row.user .msg-time {
      text-align: right;
    }

    /* Quick Reply Chips */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
      animation: fadeSlide 0.25s ease-out;
    }

    .chip {
      background: #ffffff;
      color: #0f4c81;
      border: 1.5px solid #93c5fd;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 2px 4px rgba(15, 76, 129, 0.08);
    }

    .chip:hover {
      background: #0f4c81;
      color: #ffffff;
      border-color: #0f4c81;
      transform: translateY(-1px);
    }

    /* Download Button */
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.4);
    }

    /* Typing Indicator */
    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input Area */
    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 15px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      transition: border-color 0.2s, background 0.2s;
    }

    .chat-input input:focus {
      border-color: #0f4c81;
      background: #ffffff;
    }

    .chat-input button {
      background: linear-gradient(135deg, #0f4c81, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .chat-input button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      font-size: 10.5px;
      color: #64748b;
      background: #f8fafc;
      padding: 6px 10px;
      border-top: 1px solid #f1f5f9;
    }

    @media (max-width: 500px) {
      body { padding: 0; }
      .chat-shell { height: 100vh; max-height: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="chat-shell">
    <!-- Header -->
    <div class="chat-header">
      <div class="brand-wrap">
        <div class="brand-avatar">SS</div>
        <div class="brand-info">
          <h1>Sri Sai Online Services</h1>
          <span class="brand-sub">Rampur Online Center • PAN Center</span>
          <div class="status-row">
            <span class="status-dot" id="statusDot"></span>
            <span id="serverStatus">Connecting to server...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="soundBtn" title="Toggle Welcome Sound" onclick="toggleSound()">🔊</button>
        <button class="reset-btn" onclick="resetChat()">New Card</button>
      </div>
    </div>

    <!-- Time-Based Greeting Banner -->
    <div class="welcome-banner">
      <div class="welcome-text" id="greetingBanner">
        <strong>Welcome to Sri Sai Online Services</strong>
        Rampur Online Center &amp; PAN Center
      </div>
      <span class="service-badge">TS RATION PDF</span>
    </div>

    <!-- Chat Area -->
    <div class="chat-body" id="chatBody"></div>

    <!-- Input Form -->
    <form class="chat-input" id="chatForm">
      <input type="text" id="userInput" placeholder="Enter 12-digit Ration Number..." autocomplete="off" />
      <button type="submit" id="sendBtn">Send</button>
    </form>

    <div class="footer-note">
      Sri Sai Online Services, X Road, Rampur • Instant In-Memory PDF (No Data Stored)
    </div>
  </div>

  <script>
    let API_BASE = "";
    let soundEnabled = true;
    let hasPlayedWelcome = false;

    const chatBody = document.getElementById("chatBody");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const serverStatus = document.getElementById("serverStatus");
    const statusDot = document.getElementById("statusDot");
    const greetingBanner = document.getElementById("greetingBanner");
    const soundBtn = document.getElementById("soundBtn");

    let state = {};

    // Time-based greeting helper
    function getTimeGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return "Good Morning ☀️";
      if (hour < 17) return "Good Afternoon 🌤️";
      return "Good Evening 🌆";
    }

    function updateGreetingBanner() {
      const greet = getTimeGreeting();
      greetingBanner.innerHTML = `<strong>${greet}! Welcome to Sri Sai Online Services</strong>Rampur Online Center — PAN Center`;
    }

    // Crisp Web Audio Welcome Chime (no external MP3 required)
    function playWelcomeChime() {
      if (!soundEnabled || hasPlayedWelcome) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
        const now = ctx.currentTime;
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + i * 0.11);
          gain.gain.setValueAtTime(0.001, now + i * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.12, now + i * 0.11 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.11);
          osc.stop(now + i * 0.11 + 0.36);
        });
        hasPlayedWelcome = true;
      } catch (e) {
        // Browser blocked autoplay; will trigger on first user click/tap
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
      if (soundEnabled) {
        hasPlayedWelcome = false;
        playWelcomeChime();
      }
    }

    // Fallback: if browser blocks autoplay on load, play chime on first interaction
    function unlockAudioOnce() {
      if (!hasPlayedWelcome && soundEnabled) {
        playWelcomeChime();
      }
      window.removeEventListener("pointerdown", unlockAudioOnce);
      window.removeEventListener("keydown", unlockAudioOnce);
    }
    window.addEventListener("pointerdown", unlockAudioOnce);
    window.addEventListener("keydown", unlockAudioOnce);

    function getCurrentTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    async function loadServerUrl() {
      try {
        const res = await fetch(
          `https://api.github.com/repos/srisaionline/Chat/contents/url.json?t=${Date.now()}`,
          {
            cache: "no-store",
            headers: { "Accept": "application/vnd.github+json" }
          }
        );
        if (!res.ok) throw new Error("API fetch failed");
        const meta = await res.json();
        const decoded = atob(meta.content.replace(/\n/g, ""));
        const data = JSON.parse(decoded);

        if (!data.api_url) throw new Error("api_url missing");
        API_BASE = data.api_url.replace(/\/+$/, "");
        serverStatus.textContent = "Server Online (EPDS Ready)";
        statusDot.className = "status-dot online";
        return true;
      } catch (err) {
        try {
          const fallback = await fetch(
            `https://raw.githubusercontent.com/srisaionline/Chat/main/url.json?t=${Date.now()}`,
            { cache: "no-store" }
          );
          const data = await fallback.json();
          API_BASE = data.api_url.replace(/\/+$/, "");
          serverStatus.textContent = "Server Online (EPDS Ready)";
          statusDot.className = "status-dot online";
          return true;
        } catch {
          serverStatus.textContent = "Server Offline";
          statusDot.className = "status-dot offline";
          return false;
        }
      }
    }

    function addMsg(html, sender = "bot") {
      const row = document.createElement("div");
      row.className = `msg-row ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = `msg ${sender}`;
      bubble.innerHTML = html;

      const time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = getCurrentTime();

      row.appendChild(bubble);
      row.appendChild(time);
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
      return row;
    }

    function addTypingMsg(text) {
      return addMsg(
        `<div style="margin-bottom:4px;">${text}</div><div class="typing"><span></span><span></span><span></span></div>`,
        "bot"
      );
    }

    function addChips(options, onSelect) {
      const wrap = document.createElement("div");
      wrap.className = "quick-replies";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = opt.label;
        btn.onclick = () => {
          wrap.remove();
          addMsg(opt.label, "user");
          onSelect(opt.value);
        };
        wrap.appendChild(btn);
      });
      chatBody.appendChild(wrap);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function setInputEnabled(enabled, placeholder = "Type your reply...") {
      userInput.disabled = !enabled;
      sendBtn.disabled = !enabled;
      userInput.placeholder = placeholder;
      if (enabled) userInput.focus();
    }

    async function resetChat() {
      updateGreetingBanner();
      chatBody.innerHTML = "";
      state = { step: "RATION_NO", rationNo: "", scraped: null, hof: "", village: "", pincode: "" };
      setInputEnabled(false, "Connecting...");

      const ok = await loadServerUrl();
      if (!ok) {
        addMsg("Server is currently offline. Please start the PC Server Controller and click <b>New Card</b>.");
        return;
      }

      const greet = getTimeGreeting();
      addMsg(
        `<b>${greet}!</b><br>Welcome to <b>Sri Sai Online Services — Rampur Online Center &amp; PAN Center</b>.<br><br>` +
        `Please enter your <b>12-digit Telangana Ration Card Number</b> to generate your Smart QR PDF:`
      );
      setInputEnabled(true, "e.g. 360000000000");
    }

    async function handleRationNo(rcNo) {
      if (!/^\d{12}$/.test(rcNo)) {
        addMsg("Ration Card Number must be exactly <b>12 digits</b>. Please try again.");
        return;
      }
      state.rationNo = rcNo;
      setInputEnabled(false, "Fetching from EPDS...");
      const loading = addTypingMsg("Fetching live details from <b>EPDS Telangana</b>, please wait...");

      try {
        const res = await fetch(`${API_BASE}/api/fetch`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ration_no: rcNo })
        });
        const data = await res.json();
        loading.remove();

        if (!res.ok) throw new Error(data.detail || "Could not fetch details.");

        state.scraped = data;
        state.step = "HOF";
        addMsg(
          `✅ Card found for <b>${data.district || "Telangana"} / ${data.mandal || "-"}</b> (FP Shop: <b>${data.fp_shop_no || "-"}</b>).<br>` +
          `Select the <b>Head of Family</b>:`
        );

        addChips(
          data.members.map(m => ({ label: m.name, value: m.name })),
          (selectedHof) => {
            state.hof = selectedHof;
            state.step = "VILLAGE";
            addMsg("Enter your <b>Village / Ward Name</b>:");
            setInputEnabled(true, "e.g. Rampur");
          }
        );
      } catch (err) {
        loading.remove();
        addMsg(`⚠️ ${err.message}<br>Please enter the 12-digit Ration Number again.`);
        setInputEnabled(true, "Enter 12-digit Ration Number");
      }
    }

    async function generatePdf() {
      setInputEnabled(false, "Generating Smart QR PDF...");
      const loading = addTypingMsg("Designing your high-resolution <b>Smart QR Ration Card PDF</b>...");

      try {
        const payload = {
          ration_no: state.rationNo,
          hof_name: state.hof,
          fp_shop_no: state.scraped.fp_shop_no,
          village: state.village,
          mandal: state.scraped.mandal,
          district: state.scraped.district,
          pincode: state.pincode,
          members: state.scraped.members
        };

        const res = await fetch(`${API_BASE}/api/generate-pdf`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.detail || "PDF generation failed.");
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const fileName = `${state.hof} - TS Ration Smart Card.pdf`;

        loading.remove();
        addMsg(
          `🎉 Your <b>Smart QR Ration Card PDF</b> is ready!<br>` +
          `<small style="color:#64748b;">Generated in memory — no copy is stored on the server.</small><br>` +
          `<a class="download-btn" href="${url}" download="${fileName}">⬇️ Download Smart Card PDF</a>`
        );

        setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000);
        setInputEnabled(false, "Click 'New Card' above to start again");
      } catch (err) {
        loading.remove();
        addMsg(`⚠️ Failed: ${err.message}`);
        setInputEnabled(false, "Click 'New Card' to retry");
      }
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = "";
      addMsg(text, "user");

      if (state.step === "RATION_NO") {
        await handleRationNo(text);
      } else if (state.step === "VILLAGE") {
        state.village = text;
        state.step = "PINCODE";
        addMsg("Enter your <b>6-digit Pincode</b>:");
        setInputEnabled(true, "e.g. 506151");
      } else if (state.step === "PINCODE") {
        if (!/^\d{6}$/.test(text)) {
          addMsg("Please enter a valid <b>6-digit pincode</b>.");
          return;
        }
        state.pincode = text;
        state.step = "DONE";
        await generatePdf();
      }
    });

    // Initialize on load
    window.addEventListener("DOMContentLoaded", () => {
      updateGreetingBanner();
      playWelcomeChime();
      resetChat();
    });
  </script>
</body>
</html>
